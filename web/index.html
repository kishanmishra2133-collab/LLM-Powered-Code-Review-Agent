<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ReviewLens - High-Precision LLM Code Review Agent</title>
  <meta name="description" content="ReviewLens reads a GitHub pull request, finds real bugs and security defects, and reports them as comments anchored to exact lines with measured precision.">
  
  <!-- Modern Typography from Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/tokens.css?v=4">
  <link rel="stylesheet" href="/base.css?v=4">
  <link rel="stylesheet" href="/app.css?v=4">
</head>
<body>
  <!-- Night Sky Meteor Shower Canvas -->
  <canvas id="meteorCanvas"></canvas>

  <header class="app-header">
    <div class="container header-content">
      <a href="/" class="logo-group">
        <div class="logo-icon">RL</div>
        <span class="logo-title">ReviewLens</span>
        <span class="badge-tag">LangGraph + Gemini</span>
      </a>
      <div class="header-links">
        <button type="button" id="themeToggleBtn" class="theme-toggle-btn" title="Toggle Night/Day Theme" aria-label="Toggle theme">
          <span id="themeIcon">🌙</span>
        </button>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="btn-secondary">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
          </svg>
          GitHub
        </a>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Hero & Search -->
    <section class="hero-section">
      <h1 class="hero-title">Precision-Driven Code Reviews</h1>
      <p class="hero-subtitle">Review any GitHub PR, repository, individual file, local code, or upload files.</p>

      <form id="reviewForm" class="review-form">
        <div class="unified-input-bar">
          <!-- Upload Menu Button -->
          <div class="upload-dropdown-wrapper">
            <button type="button" id="uploadMenuBtn" class="upload-icon-btn" title="Upload files or folder" aria-label="Upload options">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </button>

            <!-- Dropdown Menu -->
            <div id="uploadDropdown" class="upload-menu">
              <button type="button" class="upload-menu-item" id="optUploadFile">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                Upload File(s)
              </button>
              <button type="button" class="upload-menu-item" id="optUploadFolder">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
                Upload Folder
              </button>
            </div>

            <!-- Hidden File & Folder Inputs -->
            <input type="file" id="filePicker" multiple style="display: none;" />
            <input type="file" id="folderPicker" webkitdirectory directory style="display: none;" />
          </div>

          <!-- Selected File Badge (shows when file/folder uploaded) -->
          <div id="selectedBadge" class="selected-badge" style="display: none;">
            <span id="badgeIcon" class="badge-icon">📄</span>
            <span id="badgeText" class="badge-text">file.java</span>
            <button type="button" id="clearUploadBtn" class="badge-close" title="Remove">&times;</button>
          </div>

          <!-- Main Unified Input -->
          <input 
            type="text" 
            id="targetInput" 
            class="unified-input" 
            placeholder="Paste GitHub URL (PR, repo, file), local path, or code..." 
            autocomplete="off"
            spellcheck="false"
          />

          <!-- Submit Button -->
          <button type="submit" id="submitBtn" class="btn-primary">
            <span>Start Review</span>
          </button>
        </div>
      </form>
    </section>

    <!-- Error Card -->
    <div id="errorCard" class="error-card" role="alert"></div>

    <!-- Stepper Progress -->
    <section id="stepperContainer" class="stepper-container" aria-label="Review Progress">
      <div class="stepper">
        <div class="step-item" id="step-fetch">
          <div class="step-circle">1</div>
          <span class="step-title">Fetch</span>
        </div>
        <div class="step-item" id="step-filter">
          <div class="step-circle">2</div>
          <span class="step-title">Filter</span>
        </div>
        <div class="step-item" id="step-annotate">
          <div class="step-circle">3</div>
          <span class="step-title">Annotate</span>
        </div>
        <div class="step-item" id="step-review">
          <div class="step-circle">4</div>
          <span class="step-title">Review</span>
        </div>
        <div class="step-item" id="step-validate">
          <div class="step-circle">5</div>
          <span class="step-title">Validate</span>
        </div>
        <div class="step-item" id="step-verify">
          <div class="step-circle">6</div>
          <span class="step-title">Verify</span>
        </div>
        <div class="step-item" id="step-finalize">
          <div class="step-circle">7</div>
          <span class="step-title">Finalize</span>
        </div>
      </div>
    </section>

    <!-- Summary Metrics (Price/Cost removed as requested) -->
    <section id="summaryStrip" class="summary-strip" aria-label="Summary Metrics">
      <div class="metric-card">
        <div class="metric-val" id="metricFindings">0</div>
        <div class="metric-lbl">Findings</div>
      </div>
      <div class="metric-card">
        <div class="metric-val" id="metricTokens">0</div>
        <div class="metric-lbl">Tokens</div>
      </div>
      <div class="metric-card">
        <div class="metric-val" id="metricLatency">0ms</div>
        <div class="metric-lbl">Latency</div>
      </div>
      <div class="metric-card">
        <div class="metric-val" id="metricSkipped">0</div>
        <div class="metric-lbl">Files Skipped</div>
      </div>
    </section>

    <!-- Diff & Findings Container -->
    <section id="diffContainer" class="diff-container" aria-label="Review Results">
      <!-- Dynamically filled with findings cards and diff views -->
    </section>
  </main>

  <script src="/app.js?v=4"></script>
</body>
</html>
